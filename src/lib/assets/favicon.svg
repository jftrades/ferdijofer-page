<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- 8-point star/compass -->
  <g transform="translate(32,32)">
    <!-- Main 4-point star -->
    <polygon points="0,-22 4,-6 0,-10 -4,-6" fill="white"/>
    <polygon points="0,22 4,6 0,10 -4,6" fill="white"/>
    <polygon points="-22,0 -6,4 -10,0 -6,-4" fill="white"/>
    <polygon points="22,0 6,4 10,0 6,-4" fill="white"/>
    <!-- Diagonal points -->
    <polygon points="-15,-15 -4,-6 -8,-8 -6,-4" fill="white" opacity="0.8"/>
    <polygon points="15,-15 4,-6 8,-8 6,-4" fill="white" opacity="0.8"/>
    <polygon points="-15,15 -4,6 -8,8 -6,4" fill="white" opacity="0.8"/>
    <polygon points="15,15 4,6 8,8 6,4" fill="white" opacity="0.8"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="5" fill="white"/>
  </g>
</svg>
